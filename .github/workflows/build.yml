name: Build Monara Linux ISO

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel gcc make wget curl \
            bc flex bison xorriso python \
            openssl libarchive

      - name: Fetch kernel and runit sources
        run: |
          mkdir -p sources
          source config
          wget -q "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$LINUX_VERSION.tar.xz" -O "sources/linux-$LINUX_VERSION.tar.xz" &
          wget -q "https://github.com/PhialsBasement/runit/releases/download/2.2.0/runit-$RUNIT_VERSION.tar.gz" -O "sources/runit-$RUNIT_VERSION.tar.gz" &
          wait

      - name: Build hybrid (binary packages + custom kernel)
        run: |
          source config
          source scripts/lib.sh
          bash build-hybrid.sh

      - name: Create ISO
        run: make iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: monara-linux-iso
          path: monara-*.iso
          compression-level: 0

      - name: Upload initramfs (debug)
        uses: actions/upload-artifact@v4
        with:
          name: monara-initramfs
          path: iso/boot/initramfs.gz
          compression-level: 0
